id = "openr"
name = "Openr"
version = "0.3.0"
min_herdr_version = "0.7.0"
description = "Fuzzy-pick recently mentioned file paths and URLs from the current pane, or from the agent's session transcript via asf; URLs open in the browser, files in your editor (enter) or file manager (ctrl-f)."
platforms = ["macos", "linux"]

[[actions]]
id = "pick"
title = "Openr: open file/URL from current pane"
contexts = ["workspace"]
command = ["bash", "bin/open.sh"]

# visible viewport only — never the transcript
[[actions]]
id = "pick-visible"
title = "Openr: open file/URL from visible pane content"
contexts = ["workspace"]
command = ["bash", "bin/open.sh", "visible"]

# agent session transcript only, read with asf (fails on non-agent panes)
[[actions]]
id = "pick-transcript"
title = "Openr: open file/URL from agent transcript"
contexts = ["workspace"]
command = ["bash", "bin/open.sh", "transcript"]

[[panes]]
id = "picker"
title = "Openr"
placement = "popup"
command = ["zsh", "-c", "exec \"$HERDR_PLUGIN_ROOT/bin/pane-pick\""]

# Suggested binds for ~/.config/herdr/config.toml (with `herdr --remote`,
# the client's config.toml, not the server's):
#
#   [[keys.command]]
#   key = "prefix+f"
#   type = "plugin_action"
#   command = "openr.pick"
#   description = "open file/URL: agent transcript, else visible pane"
#
#   [[keys.command]]
#   key = "prefix+shift+f"
#   type = "plugin_action"
#   command = "openr.pick-visible"
#   description = "open file/URL from visible pane"
#
# After edits: `herdr server reload-config`.
